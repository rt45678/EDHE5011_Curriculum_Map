let active = null;

function activate(el) {
  const id = el.getAttribute('data-id');
  if (active === id) { reset(); return; }
  active = id;
  const connected = connections[id] || [];

  // Dim/highlight nodes
  document.querySelectorAll('.node').forEach(n => {
    const nid = n.getAttribute('data-id');
    if (connected.includes(nid)) {
      n.classList.remove('dimmed');
      n.classList.add('highlighted');
    } else {
      n.classList.add('dimmed');
      n.classList.remove('highlighted');
    }
  });

  // Show relevant connection lines
  document.querySelectorAll('.connection-line').forEach(line => {
    const conns = (line.getAttribute('data-conn') || '').split(' ');
    const relevant = conns.some(c => connected.includes(c)) && conns.some(c => c === id || connected.includes(c));
    line.classList.toggle('active', relevant && conns.includes(id));
  });

  // Show detail panel
  const d = details[id];
  if (d) {
    document.getElementById('dp-title').textContent = d.title;
    document.getElementById('dp-body').textContent = d.body;
    document.getElementById('dp-tags').innerHTML = d.tags.map(t => `<span class="tag">${t}</span>`).join('');
    document.getElementById('detail-panel').classList.add('visible');
  }
}

function reset() {
  active = null;
  document.querySelectorAll('.node').forEach(n => {
    n.classList.remove('dimmed','highlighted');
  });
  document.querySelectorAll('.connection-line').forEach(l => l.classList.remove('active'));
  document.getElementById('detail-panel').classList.remove('visible');
}
</script>
